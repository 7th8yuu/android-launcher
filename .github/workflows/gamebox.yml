name: Build Game Box
on:
  push:
    paths: ['gamebox/**', '.github/workflows/gamebox.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle -p gamebox assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GameBox-debug
          path: gamebox/app/build/outputs/apk/debug/*.apk
